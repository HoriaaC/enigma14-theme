name: Deploy Theme to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Theme to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code from repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          protocol: ftps
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            package.json
            package-lock.json
            tailwind.config.js
            README.md
